name: Build Headshot Tool Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.3'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        # ลบ modules: qtbase ออกแล้วเพื่อป้องกัน Error

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build --config Release

    - name: Deploy Qt Binaries (windeployqt)
      run: |
        windeployqt --release --no-compiler-runtime build/Release/headshot_tool.exe

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: headshot_tool_win64
        path: |
          build/Release/
