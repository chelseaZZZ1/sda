name: Build FiveM ESP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone Dear ImGui
      run: |
        git clone https://github.com/ocornut/imgui.git imgui

    - name: Setup Developer Command Prompt for Microsoft Visual C++
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile with MSVC
      run: |
        cl /std:c++20 /EHsc /O2 -I. -Iimgui -Iimgui/backends fivem_esp.cpp imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/backends/imgui_impl_win32.cpp imgui/backends/imgui_impl_dx11.cpp /link d3d11.lib dxgi.lib user32.lib gdi32.lib /out:fivem_esp.exe

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fivem-esp-executable
        path: fivem_esp.exe
